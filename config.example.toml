# Guardian configuration — copy to guardian.toml and edit.
# Each [[process]] block is one process to launch and keep alive.

[[process]]
name = "my-app"
command = "C:\\Program Files\\MyApp\\myapp.exe"
# If this exe image name is already running, adopt it instead of spawning new.
# adopt = "myapp.exe"
# args = ["--some-flag"]
# cwd = "C:\\Program Files\\MyApp"

# [env]
# SOME_VAR = "value"

# Retry backoff (milliseconds). Starts at restart_delay_ms, doubles each
# consecutive fast death up to max_restart_delay_ms. Resets once the process
# survives healthy_uptime_secs.
restart_delay_ms = 1000
max_restart_delay_ms = 30000
backoff_factor = 2.0

# -1 = restart forever. 0 = never restart. N = give up after N fast restarts.
max_restarts = -1

# How long a process must stay alive to be considered healthy (resets backoff).
healthy_uptime_secs = 60

# Add more blocks to watch more processes.
# [[process]]
# name = "another-app"
# command = "C:\\path\\to\\app.exe"
