name: build-mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: macos-13        # Intel
            target: x86_64-apple-darwin
          - runner: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Test
        run: cargo test --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/guardian dist/
          cp README.md LICENSE config.example.toml dist/
          zip -j guardian-macos-${{ matrix.target }}.zip dist/*
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: guardian-macos-${{ matrix.target }}
          path: guardian-macos-${{ matrix.target }}.zip
