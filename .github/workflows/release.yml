name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Test
        run: cargo test
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/guardian.exe dist/
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Copy-Item config.example.toml dist/
          # No default guardian.toml: the GUI starts empty; users add entries there.
          Compress-Archive -Path dist/* -DestinationPath "guardian-${env:GITHUB_REF_NAME}-windows-x86_64.zip"
      - name: Upload Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: guardian-${{ github.ref_name }}-windows-x86_64.zip
          generate_release_notes: true

  release-mac:
    strategy:
      matrix:
        include:
          - runner: macos-13        # Intel
            target: x86_64-apple-darwin
          - runner: macos-14        # Apple Silicon
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Test
        run: cargo test --target ${{ matrix.target }}
      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/guardian dist/
          cp README.md LICENSE config.example.toml dist/
          zip -j "guardian-${GITHUB_REF_NAME}-macos-${{ matrix.target }}.zip" dist/*
      - name: Upload Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: guardian-${{ github.ref_name }}-macos-${{ matrix.target }}.zip
