[package]
name = "guardian"
version = "0.3.0"
edition = "2024"
description = "A tiny, visual process guardian for Windows that restarts crashed apps."
license = "MIT"
repository = "https://github.com/Michael-py001/guardian"

[dependencies]
anyhow = "1"
chrono = "0.4"
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
tray-icon = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
