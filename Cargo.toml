[package]
name = "guardian"
version = "0.3.2"
edition = "2024"
description = "A tiny, visual process guardian for Windows that restarts crashed apps."
license = "MIT"
repository = "https://github.com/Michael-py001/guardian"
build = "build.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
eframe = "0.31"
egui = "0.31"
rfd = "0.15"
raw-window-handle = "0.6"
tray-icon = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
strip = true
